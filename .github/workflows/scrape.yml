name: scrape

on:
  # Fallback only: GitHub often delays or skips scheduled runs on quiet repos (gaps of hours).
  # The real trigger is an outside timer calling workflow_dispatch every 10 minutes
  # (docs/SETUP.md, section 7). Minutes are off the busy :00/:15/:30/:45 marks on purpose.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: read  # the run-gap watchdog reads previous run times

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen

      # Missing secrets are fine: the run still updates data/, it just skips Telegram.
      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tracker run

      - name: Regenerate README
        run: uv run python -m tracker readme

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md README-archive.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update listings"
          git push || { git pull --rebase && git push; }
