name: cloud-check

# Run the fetchers for some companies from GitHub's servers, to see whether their career
# sites answer or block cloud IPs. Prints counts only: saves nothing, sends nothing.
on:
  workflow_dispatch:
    inputs:
      companies:
        description: "Comma-separated company slugs, e.g. nvidia,intel"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Check companies
        env:
          COMPANIES: ${{ inputs.companies }}
        run: uv run python -m tracker check --companies "$COMPANIES"
