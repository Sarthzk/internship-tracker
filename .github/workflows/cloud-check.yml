name: cloud-check

# Run the fetchers for some companies from GitHub's servers, to see whether their career
# sites answer or block cloud IPs. Prints counts only: saves nothing, sends nothing.
on:
  workflow_dispatch:
    inputs:
      companies:
        description: "Comma-separated company slugs, e.g. nvidia,intel"
        required: true

concurrency:
  group: cloud-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - name: Check companies
        env:
          COMPANIES: ${{ inputs.companies }}
        run: uv run python -m tracker check --companies "$COMPANIES"
