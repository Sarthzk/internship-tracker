name: tests

on:
  push:
    paths-ignore:
      - "data/**"
      - "README*.md"
  pull_request:
    paths-ignore:
      - "data/**"
      - "README*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
