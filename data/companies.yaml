# Company registry. Loaded into tracker.models.Company.
#
# slug:        our internal kebab-case id (used in listing ids). NOT the ATS board token.
# tier:        1 = must-have, 2 = nice-to-have
# ats:         greenhouse | lever | ashby | smartrecruiters | workday | eightfold | oracle_hcm
#              | phenom | custom | unknown
# ats_config:  greenhouse {board_token}, lever/ashby {site}, smartrecruiters {company_id},
#              workday {host, tenant, site}, eightfold {host, domain, public_host?}, oracle_hcm {host, site, public_host?},
#              phenom {host, locale?}
# careers_url: where students find the company's openings (also what fingerprint_platforms.py fetches)
# enabled:     only enabled companies are fetched; requires ats != unknown
# exclude_titles: optional list of regexes; titles matching one are dropped for this company
# link_hosts:  optional extra hostnames posting links may use (the company's own careers site);
#              links on any other host are held for the owner's review (tracker/linkcheck.py)
# check_every_minutes: optional, a multiple of 10 (default 10); for sites that rate-limit us

companies:
  - name: Google
    slug: google
    tier: 1
    tag: Big Tech
    ats: custom
    ats_config: {}
    link_hosts: [www.google.com]
    careers_url: https://www.google.com/about/careers/applications/jobs/results/?q=intern&location=India
    enabled: true
    notes: 'Custom fetcher: positional data embedded in the results page (ds:1); fragile, fails loudly. Found 2026-10-28; cloud-checked 2026-10-28.'
