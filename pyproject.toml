[project]
name = "tracker"
version = "0.1.0"
description = "Tracks tech internship postings in India from company career portals."
requires-python = ">=3.14,<3.15"
dependencies = [
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tracker"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
